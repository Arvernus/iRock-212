; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = IROCK_212_v1_0, IROCK_212_v1_1, IROCK_212_v1_11, IROCK_212_v2_4
description = iRock 212 OS

[env]
platform = ststm32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_archive = no
check_tool = cppcheck, clangtidy
check_skip_packages = true
check_flags = 
	cppcheck: --enable=all --std=c++11 --addon=cert.py --suppress=missingIncludeSystem
	clangtidy: --checks=*,-llvm-include-order,-llvmlibc-*,-cppcoreguidelines-avoid-magic-numbers,-readability-magic-numbers

[extra]
build_flags_external = 
	-Iinclude
	-D MAPPING_IO_PIN_LIST=\"PinList.h\"
	-D MAPPING_IO_SIGNAL_LIST=\"SignalList.h\"
	-D MAPPING_IO_MAPPING_LIST=\"MappingList.h\"
	-D BAT_SHUTOFF_SIGNAL_LIST=\"BatShutoffList.h\"
	-D BALACER_SIGNAL_LIST=\"BalancerList.h\"
	-D SSRSWITCHER_SIGNAL_LIST=\"SSRSwitcherList.h\"
	-D TM_ENABLE_CAPTURED_LAMBDAS

[env:IROCK_212_v1_0]
board = IROCK_212_v1_0
lib_deps = 
	file://lib/IROCK_212_V1_0
	irock/Balancer@^1.0.3
	irock/CLI@^1.0.5
	tcmenu/TaskManagerIO@^1.5.1
	irock/BatShutoff@^1.1.6
	irock/SSRSwitcher@^1.0.10
	irock/MappingIO@^2.0.2
build_flags = 
	-Ilib/IROCK_212_V1_0
	${extra.build_flags_external}

[env:IROCK_212_v1_1]
board = IROCK_212_v1_1
lib_deps = 
	file://lib/IROCK_212_V1_1
	irock/CLI@^1.0.5
	irock/MappingIO@^2.0.2
	irock/Balancer@^1.0.3
	tcmenu/TaskManagerIO@^1.5.1
	irock/BatShutoff@^1.1.6
	irock/SSRSwitcher@^1.0.10
build_flags = 
	-Ilib/IROCK_212_V1_1
	${extra.build_flags_external}

[env:IROCK_212_v1_11]
board = IROCK_212_v1_11
