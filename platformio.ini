	irock/Balancer@^1.0.3
	irock/CLI@^1.0.5
	irock/MappingIO@^2.0.2
	tcmenu/TaskManagerIO@^1.5.1
	irock/BatShutoff@^1.1.6
	irock/SSRSwitcher@^1.0.10
	irock/ModbusToWorld@^1.0.11
build_flags = 
